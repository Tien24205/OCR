# Lop phu cho mot lan trien khai THAT, qua Cloudflare Tunnel.
#
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Huong dan day du: muc "Triển khai miễn phí bằng Cloudflare Tunnel" trong
# README.md.
#
# TEP NAY KHONG CHUA KHOA NAO. Hai bien bat buoc (`JWT_SECRET`,
# `CLOUDFLARE_TUNNEL_TOKEN`) duoc doc tu moi truong hoac tu tep `.env` o GOC
# du an - khong phai `backend/.env`. Dat sai cho la compose khong thay, va
# no se bao ngay luc khoi dong chu khong hong am tham.

services:
  backend:
    # DONG CONG 8000. Giao dien goi backend qua mang noi bo cua compose
    # (`http://backend:8000`), nen khong ai can goi no tu ben ngoai.
    #
    # De mo thi API nam tren Internet, va thu duy nhat che no la `API_KEYS`.
    # Da kiem: dong cong nay xong, ung dung van chay du - chi co dieu backend
    # khong con voi toi duoc tu ngoai.
    ports: !override []
    environment:
      # `:?` = compose TU CHOI khoi dong khi bien trong, kem dong nhac duoi.
      #
      # De trong thi khoa ky duoc sinh ngau nhien moi lan khoi dong, tuc moi
      # lan `docker compose restart` la TAT CA nguoi dung bi dang xuat - va
      # khong co gi trong log noi cho ho biet vi sao. Da do: phieu tra 401
      # sau restart khi de trong, tra 200 khi dat co dinh.
      JWT_SECRET: "${JWT_SECRET:?can JWT_SECRET. Sinh bang: python -c \"import secrets; print(secrets.token_urlsafe(48))\"}"
      # DONG CUA DANG KY. Day la thu chan lo hong nang nhat cua ban cong
      # khai, va ly do no can ton tai:
      #
      #   dang ky mo  +  ban ghi `owner_id IS NULL` hien voi moi nguoi dang
      #   nhap  =  bat ky ai mo duoc dia chi deu tai ve duoc toan bo danh
      #   thiep, ke ca ANH da chup, va mot ban xuat day du.
      #
      # Da do that truoc khi sua: nguoi la vua dang ky lay duoc danh sach ban
      # quet, noi dung, anh, danh sach ho so va mot ban xuat 3112 byte.
      #
      # KHONG KHOA CHET: khi CSDL chua co tai khoan nao thi `/register` van
      # nhan, de nguoi dau tien vao duoc va thanh quan tri. Nen hay dang ky
      # NGAY sau khi dung len, truoc khi tro ten mien ve - trong khe ho do
      # ai vao truoc thi nguoi do la quan tri.
      #
      # Sau khi da co quan tri, tai khoan moi duoc cap trong giao dien:
      # trang Tong quan > "Cấp tài khoản cho người khác".
      REGISTRATION_OPEN: "${REGISTRATION_OPEN:-false}"
    # VOLUME RIENG, tach han `ocr-data` cua may phat trien.
    #
    # `ocr-data` dang chua danh thiep THAT cua nguoi that - ten, so dien
    # thoai, dia chi email. Gan no vao mot dich vu nam tren Internet la mot
    # su co du lieu ca nhan, khong phai mot lan trien khai.
    volumes: !override
      - ocr-prod-data:/app/backend/data

  frontend:
    # Chi mo tren 127.0.0.1, KHONG mo ra moi giao dien mang cua may chu.
    #
    # VI SAO VAN MO: de con `curl http://localhost:8501` kiem tra ngay tren
    # may chu khi co su co. Duong ra Internet la qua `cloudflared` ben duoi,
    # di trong mang noi bo cua compose - khong qua cong nay.
    #
    # Dat `8501:8501` tran (khong co `127.0.0.1:`) la mo thang cong 8501 ra
    # Internet bang HTTP tran, va nhu vay thi ca duong Cloudflare tro nen vo
    # nghia: nguoi ta van vao duoc bang IP va khong co ma hoa.
    ports: !override
      - "127.0.0.1:8501:8501"

  # --- Duong ra Internet ----------------------------------------------------
  #
  # `cloudflared` mo mot ket noi DI RA tu container toi Cloudflare, roi luu
  # luong chay nguoc ve qua chinh ket noi do. Nghia la may chu KHONG can mo
  # cong nao vao, khong can IP tinh, khong can cau hinh tuong lua.
  #
  # VI SAO CAN CLOUDFLARE CHU KHONG PHAI CHI MOT TEN MIEN: trinh duyet chan
  # camera va chan cai PWA tren `http://`. Khong co HTTPS thi mat duong chup
  # anh - tuc mat tinh nang chinh. Cloudflare cap va gia han chung chi mien
  # phi, khong phai lam gi them.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # `--no-autoupdate`: ban trong container duoc thay bang cach keo image
    # moi, khong phai bang cach tu sua chinh no luc dang chay.
    command: tunnel --no-autoupdate --protocol ${TUNNEL_PROTOCOL:-http2} run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?can CLOUDFLARE_TUNNEL_TOKEN. Lay o Cloudflare Zero Trust > Networks > Tunnels}"
      # GIAO THUC: mac dinh cua cloudflared la QUIC, chay tren UDP cong 7844.
      # Rat nhieu mang gia dinh va mang cong ty o Viet Nam CHAN UDP ra ngoai,
      # va khi do tunnel bao "Failed to dial a quic connection" roi Cloudflare
      # tra loi 530 - mot ma loi khong he nhac gi den UDP.
      #
      # Chinh cloudflared phat hien duoc va ghi `suggested_protocol=http2`
      # trong log, nhung no KHONG tu chuyen. Dat san `http2` de khoi phai
      # doan; HTTP/2 chay tren TCP 443, tuc cung duong voi moi trang web
      # khac, nen gan nhu khong mang nao chan.
      #
      # Mang cho UDP qua thi dat TUNNEL_PROTOCOL=quic de nhanh hon mot chut.
      # (Dat bang CO DONG LENH chu khong bang bien moi truong: bien
      #  TUNNEL_PROTOCOL khong duoc ban cloudflared nay doc o che do nay -
      #  da thu, no van quay so QUIC.)
    depends_on:
      frontend:
        # `service_started` la du: `cloudflared` tu thu lai khi dich chua
        # san sang, va giao dien thi khong co healthcheck rieng.
        condition: service_started

volumes:
  # Xem ghi chu o `backend.volumes` ben tren.
  ocr-prod-data:
