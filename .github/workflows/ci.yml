# Ba cong kiem da co san trong du an, nay chay tu dong tren moi lan day code.
#
# VI SAO DUNG BA CAI NAY: ca ba deu TRA MA THOAT 1 khi co van de, nen khong
# phai viet them logic nao. Chung cung dung ba loai loi that su da xay ra:
#
#   pytest           - hong chuc nang
#   check_docs.py    - so lieu trong tai lieu lech voi ma nguon (da lech 5 lan)
#   check_secrets.py - khoa API bi commit nham
#
# KHONG cai Tesseract o day, co y: cac test can Tesseract tu bo qua khi may
# khong co no. Cai Tesseract se lam CI cham hon vai phut de doi lay vai test,
# trong khi chinh cac test do da duoc viet de chay duoc ma khong can no.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_docs.py doc so commit va danh sach file qua Git, nen can
          # lich su that chu khong phai ban checkout nong.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r frontend/requirements.txt

      # Cau hinh o ruff.toml co y HEP: chi bat E9 + F, tuc la loi that su
      # (bien khong dinh nghia, import thua, cu phap hong). Khong bat nhom
      # van phong - mot ban dif 388 cho sua dau ngoac khong bat duoc loi nao.
      - name: Linter
        run: |
          pip install ruff
          python -m ruff check backend frontend

      - name: Chạy test
        # API_KEYS rong: bo test tu ep tat xac thuc trong conftest.py, dat o
        # day de khong phu thuoc bien moi truong cua may chay.
        env:
          API_KEYS: ""
        run: python -m pytest -q

      - name: Đối chiếu số liệu tài liệu với mã nguồn
        run: python backend/scripts/check_docs.py

      - name: Quét khoá bị rò rỉ
        run: python backend/scripts/check_secrets.py

      # Lo hong cua thu vien khong hien ra trong test cua chinh minh: no nam o
      # phu thuoc, va chi lo ra khi ai do cong bo. Cong kiem nay tra ma thoat 1
      # khi mot goi dang dung co lo hong da biet.
      - name: Rà soát lỗ hổng của phụ thuộc
        run: |
          pip install pip-audit
          python -m pip_audit -r backend/requirements.txt -r frontend/requirements.txt --progress-spinner off
